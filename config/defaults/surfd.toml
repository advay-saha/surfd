# ─────────────────────────────────────────────────────────────────────────
#  surfd.toml — the one file that describes your surfd desktop.
#
#  Edit it by hand, with `surfctl`, or with Surf Settings: all three keep
#  your comments. After editing by hand, apply with:   surfctl reload
#  See every setting with its help text:                surfctl explain
#  Back to these defaults (a backup is kept):           surfctl reset
#
#  You only need the keys you change; anything missing falls back to the
#  defaults in /usr/share/surfd/defaults/surfd.toml.
# ─────────────────────────────────────────────────────────────────────────

[theme]
name = "tide"            # surfctl theme list
variant = "dark"         # "dark" or "light"   (surfctl theme variant toggle)
accent = ""              # "" = the theme's accent, or e.g. "#88c0d0"

[fonts]
ui = "Inter"
mono = "JetBrains Mono"
size = 11
mono_size = 11

[wallpaper]
path = ""                # your own image, e.g. "~/Pictures/beach.jpg"; it wins over the dynamic wallpaper
dynamic = "low-poly-mountain"  # a wallpaper that changes with the time of day; "" = the theme's wallpaper
sync = "auto"            # "auto" = follow the time of day, "theme" = lightest/darkest frame for the
                         # light/dark style, "frame" = one fixed frame (see frame)
frame = ""               # with sync = "frame": which frame (surfctl wallpaper status)
location = ""            # for sun-following sets: "35.2, 33.4" (latitude, longitude); "" = guess
mode = "fill"            # fill | fit | center | tile | stretch

[layout]
mode = "tiling"          # "tiling", or "floating" = mouse-friendly, windows float with title bars
gaps_inner = 8
gaps_outer = 6
border_width = 2
radius = 12              # rounding for bar, notifications, launcher, login screen
titlebars = false        # title bars in tiling mode (always shown in floating mode)
focus_follows_mouse = true
autotile = true          # split new windows along the longer side (a spiral, like Hyprland's dwindle)
smart_gaps = false       # no gaps around a lone window
smart_borders = true     # no border around a lone window
workspace_back_and_forth = true  # pressing the current workspace's key goes back to the previous one

[bar]
position = "top"         # "top" or "bottom"
style = "floating"       # "floating" (detached, rounded) or "docked" (edge to edge)
height = 34
# Modules: workspaces mode window taskbar clock tray network audio mic battery
#          backlight bluetooth cpu memory temperature disk keyboard media idle
#          notifications recording updates profile nightlight clipboard power
# Presets: surfctl bar preset default | minimal | classic | full
left = ["workspaces", "mode", "window"]
center = ["clock"]
right = ["tray", "recording", "updates", "notifications", "network", "audio", "battery", "power"]

[input]
keyboard_layout = "us"   # set from the installer on first login; e.g. "us,de"
keyboard_variant = ""
keyboard_options = ""    # e.g. "caps:escape,grp:alt_shift_toggle"
touchpad_tap = true
natural_scroll = true
gestures = true          # 3-finger swipe: switch workspace; swipe up: launcher
pointer_accel = 0.0      # -1 (slow) … 1 (fast)
mouse_natural_scroll = false
scroll_factor = 1.0      # scroll speed multiplier
repeat_delay = 300       # ms before a held key repeats
repeat_rate = 40         # repeats per second
numlock = true           # Num Lock on at login
hide_cursor_typing = true
hide_cursor_after = 0    # hide an idle pointer after this many seconds; 0 = never

[display]
scale = 0.0              # 0 = let Sway decide; e.g. 1.5 for HiDPI laptops
night_light = "off"      # "off", "auto" (sunset to sunrise) or "on"   (Super+Ctrl+N toggles)
night_temperature = 4000 # kelvin; lower is warmer
adaptive_sync = false    # variable refresh rate on displays that support it
clamshell = true         # laptop lid closed + external display: switch the built-in screen off

[apps]
terminal = "foot"
launcher = "fuzzel"
browser = "firefox"
files = "thunar"
editor = "mousepad"

[idle]
lock_after = 300         # seconds; 0 = never
screen_off_after = 600
suspend_after = 0

[notifications]
position = "top-right"   # top-right | top-center | top-left | bottom-right | bottom-center | bottom-left
timeout = 6000           # milliseconds; 0 = stay until dismissed
do_not_disturb = false   # hold notifications back (Super+Ctrl+D); urgent ones still show

[osd]
enabled = true           # flyouts for volume, brightness, Caps Lock, keyboard layout
position = "bottom-center"
step = 5                 # percent per key press

[power]
battery_warning = 20     # percent; 0 = never warn
battery_critical = 8

[capture]
screenshots = "~/Pictures/Screenshots"
recordings = "~/Videos/Recordings"
record_audio = false     # record what the computer plays along with the screen

[clipboard]
history = true           # Super+V picks from recently copied text
size = 100

[updates]
check = true             # look for system updates once a day; shown in the bar

[autostart]
# Extra commands to run at login. Apps that install an XDG autostart entry
# (/etc/xdg/autostart, ~/.config/autostart) start on their own.
commands = []

[keys]
modifier = "Super"       # what "Mod" means below: "Super" (Windows key) or "Alt"

# "key combination" = "action". Actions: surfctl keys actions
# Also: "exec <command>", "sway <raw sway command>", "none" to disable.
# Super + / shows all of these in a searchable cheat sheet.
