# surfd keeps installs lean: recommended (weak) dependencies are not pulled
# in automatically. Install one explicitly when you want it, or undo this
# policy system-wide with:
#   echo -e '[main]\ninstall_weak_deps=True' | sudo tee /etc/dnf/libdnf5.conf.d/90-weakdeps.conf
[main]
install_weak_deps=False
