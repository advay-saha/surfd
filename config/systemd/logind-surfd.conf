# surfd: a short press of the power button opens the power menu (lock, log out,
# suspend, restart, shut down) instead of shutting down at once. Sway binds the
# key (XF86PowerOff); a long press still powers off, and the login screen binds
# it to "shut down". Override in /etc/systemd/logind.conf.d/.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
