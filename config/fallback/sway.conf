# surfd fallback session — used only when ~/.config/surfd/surfd.toml is
# broken and no previously generated config exists. Deliberately tiny.
set $mod Mod4
font pango:sans 11
output * bg #0c1b23 solid_color
default_border pixel 2
client.focused #5ecfc2 #5ecfc2 #0c1b23 #5ecfc2 #5ecfc2

bindsym $mod+Return exec foot
bindsym $mod+space exec fuzzel
bindsym $mod+d exec fuzzel
bindsym $mod+q kill
bindsym $mod+comma exec surf-settings
bindsym $mod+Shift+e exec swaynag -t warning -m 'Log out?' -B 'Log out' 'swaymsg exit'
bindsym $mod+Shift+c reload

exec swaynag -t error -m 'surfd: your surfd.toml has a problem. Press Super+Enter for a terminal and run "surfctl doctor", or "surfctl reset" to start fresh (a backup is kept).' -B 'Open Surf Settings' 'surf-settings' -B 'Reset to defaults' 'surfctl reset --yes && swaymsg exit'
exec mako
include /etc/surfd/sway.d/*.conf
