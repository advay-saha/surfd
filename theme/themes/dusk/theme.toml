# Dusk — a surfd theme pack, written by theme/tools/make_wallpaper_themes.py. Format: docs/theme-making.md

[meta]
name = "Dusk"
description = "Violet dusk; uses the Dusk colourway wallpapers."
author = "surfd contributors"
license = "CC-BY-SA-4.0"
version = "1.0"

[cursor]
theme = "breeze_cursors"
size = 24

[dark]
background  = "#110c1f"
surface     = "#18122b"
surface_alt = "#281f41"
text        = "#e5e2ee"
text_muted  = "#a29bb5"
accent      = "#b9a3f0"
accent2     = "#8a9cf0"
urgent      = "#ec797d"
warning     = "#f4c871"
success     = "#92d685"
icon_theme  = "Papirus-Dark"
wallpaper   = "dusk-dark-3840x2160"   # a picture from the wallpaper gallery
# ANSI colours 0-7, then bright 8-15
terminal = [
  "#251e38",
  "#e0737c",
  "#88c581",
  "#e3c077",
  "#80ace4",
  "#cc96de",
  "#77cacf",
  "#c8c4d4",
  "#574e74",
  "#ef979e",
  "#a4dc9d",
  "#f1d69c",
  "#a5c7f2",
  "#e1b8ef",
  "#96dfe3",
  "#f4f3f7",
]

[light]
background  = "#efecf6"
surface     = "#fbfafc"
surface_alt = "#e0dbeb"
text        = "#1d162d"
text_muted  = "#5b4f72"
accent      = "#5a3fa8"
accent2     = "#3f4fb0"
urgent      = "#ab2b2b"
warning     = "#975f0c"
success     = "#2d7326"
icon_theme  = "Papirus-Light"
wallpaper   = "dusk-light-3840x2160"   # a picture from the wallpaper gallery
# ANSI colours 0-7, then bright 8-15
terminal = [
  "#221b32",
  "#a12d3a",
  "#357338",
  "#906623",
  "#2f61a4",
  "#8a44a2",
  "#287b84",
