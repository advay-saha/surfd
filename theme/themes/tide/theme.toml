# Tide — a surfd theme pack. Format: docs/theme-making.md

[meta]
name = "Tide"
description = "Deep ocean navy with a teal-to-blue accent. The surfd default and the colours of the logo."
author = "surfd contributors"
license = "CC-BY-SA-4.0"
version = "1.0"

[cursor]
theme = "breeze_cursors"
size = 24

[dark]
background  = "#0c1b23"
surface     = "#12252f"
surface_alt = "#1b3341"
text        = "#dee9ef"
text_muted  = "#8aa2af"
accent      = "#5ecfc2"
accent2     = "#4a90c8"   # optional: far end of accent gradients (bar's active workspace, login button, wallpaper)
urgent      = "#f2777a"
warning     = "#f4c76c"
success     = "#8cd987"
icon_theme  = "Papirus-Dark"
wallpaper   = "tide-dark-3840x2160"   # a picture from the wallpaper gallery (surfd's own colourways)
# ANSI colours 0-7, then bright 8-15
terminal = [
  "#1a2b36",
  "#f2777a",
  "#8cd987",
  "#f4c76c",
  "#5b9fd6",
  "#c59de8",
  "#5ecfc2",
  "#c5d4dc",
  "#3a5363",
  "#ff9a9c",
  "#a9eaa4",
  "#ffdb8f",
  "#93cbf5",
  "#dbbdf5",
  "#8ce8dc",
  "#f2f7f9",
]

[light]
background  = "#eef4f6"
surface     = "#fbfdfe"
surface_alt = "#dfe9ed"
text        = "#15262f"
text_muted  = "#526873"
accent      = "#0f8f85"
accent2     = "#2f6fb0"
urgent      = "#c43f45"
warning     = "#9a6a10"
success     = "#367f31"
icon_theme  = "Papirus-Light"
wallpaper   = "tide-light-3840x2160"   # a picture from the wallpaper gallery (surfd's own colourways)
# ANSI colours 0-7, then bright 8-15
terminal = [
  "#15262f",
  "#c43f45",
  "#367f31",
  "#9a6a10",
  "#2d6fa8",
  "#8a55b5",
  "#0f7f76",
  "#c7d3d9",
  "#526873",
  "#d65a5f",
  "#4e9a48",
  "#b58424",
  "#4a8cc4",
  "#a573cc",
  "#2aa89c",
  "#fbfdfe",
]
