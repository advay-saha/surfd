# Installed as /etc/anaconda/profile.d/surfd.conf
# Anaconda picks this profile when /etc/os-release has ID=surfd. It behaves
# exactly like the Fedora profile apart from branding.
[Profile]
profile_id = surfd
base_profile = fedora

[Profile Detection]
os_id = surfd

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/surfd/surfd.css
