# Licensing of every file in this repository, in REUSE format
# (https://reuse.software). Check with: reuse lint
version = 1

[[annotations]]
path = ["src/**", "build.sh", "tools/**", "kickstarts/**", "packaging/**", "config/**", "release/**",
        "containers/**", ".github/**", "Makefile", "ruff.toml", "VERSION", "theme/tools/**", "theme/plymouth/**",
        "theme/anaconda/surfd.conf"]
SPDX-FileCopyrightText = "2026 surfd contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["theme/themes/**", "theme/logos/**", "theme/anaconda/surfd.css", "docs/screenshots/**"]
SPDX-FileCopyrightText = "2026 surfd contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["**.md", "docs/**"]
SPDX-FileCopyrightText = "2026 surfd contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The wordmark outlines in brand_paths.py are glyphs of Outfit ExtraBold (SIL OFL 1.1); the logos made
# with them are artwork and stay CC-BY-SA-4.0 (the OFL does not extend to documents made with a font).
[[annotations]]
path = ["theme/tools/brand_paths.py"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 surfd contributors", "2021 The Outfit Project Authors (https://github.com/Outfitio/Outfit-Fonts)"]
SPDX-License-Identifier = "MIT AND OFL-1.1"

[[annotations]]
path = ["brand/**", "wallpapers/generated/**"]
SPDX-FileCopyrightText = "2026 surfd contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["brand/fonts/syne/syne-latin-800-normal.woff", "brand/fonts/syne/LICENSE"]
SPDX-FileCopyrightText = "The Syne Project Authors"
SPDX-License-Identifier = "OFL-1.1"
